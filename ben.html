<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="white">

  <title>emmet</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="inner-image.css">
</head>

<body>
  <a href="index.html"><img class="logo" src="Resources/logo.svg"></a>

  <div class="carousel" id="carousel">
    <div class="carousel-track" id="carouselTrack">
      <div id="tee-two" class="carousel-slide" style="padding-left: 10vw;">
        <img src="Resources/3.webp">
      </div>
      <div id="tee-one" class="carousel-slide">
        <img src="Resources/3-plain.webp">
      </div>
    </div>
  </div>



  <div id="testi">
    <div id="price">69€</div>
    <div id="warning">Book Now - Buy Later</div>
  </div>




  <form action="https://formspree.io/f/mrbqnvlo" method="POST" id="form">

    <div class="bottons" id="size-selected">
      <div id="caption">Size</div>
      <div id="size-selected-size">M</div>
    </div>
    <div id="sizes">
      <div class="bottons" data-size="M">M</div>
      <div class="bottons" data-size="L">L</div>
      <div class="bottons" data-size="XL">XL</div>
    </div>


    <div id="email-container">
      <input type="email" id="email-input" name="email" placeholder="E-mail" required>
      <div id="note">
        You'll receive a link to purchase the tee when available.
      </div>
    </div>

        <div id="exit"></div>

    <input type="hidden" name="taglia" id="taglia-input" required>

    <button id="cta" type="submit">Produce 1 for me</button>


  </form>

  <div id="messaggio-conferma" style="display: none;">
    <div class="messaggio-conferma">Received.</div>
  </div>
</body>


<script src="script.js"></script>

</html>
